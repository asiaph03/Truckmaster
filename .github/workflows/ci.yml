name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # npm workspaces (backend/frontend/packages/*) share one root
      # lockfile and node_modules — install runs at repo root.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint --workspace=backend

      - name: Build
        run: npm run build --workspace=backend

      - name: Unit tests
        run: npm test --workspace=backend

      # Integration/E2E tests against a real Postgres/Redis service
      # container are added starting Phase 1, once there is a schema and
      # RLS policies to test against (docs/TECHNICAL_ARCHITECTURE.md §16).

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=frontend

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Unit tests
        run: npm test --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend
