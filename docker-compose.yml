# OPTIONAL local development infrastructure — not a deployment configuration
# (Stage 6 §12.5 / Stage 7 explicitly defers real deployment config), and not
# required to run this project. The primary supported local setup is native
# Windows (PostgreSQL installed locally, Memurai for Redis, native minio.exe)
# — see README.md "Local Development". This file is kept as a supported
# alternative for anyone who prefers containers; it matches
# backend/.env.example's credentials/ports exactly either way.
#
# Usage:
#   docker compose up -d
#   cd backend && npm run prisma:migrate:deploy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms_dev_password
      POSTGRES_DB: tms_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tms_minio_admin
      MINIO_ROOT_PASSWORD: tms_minio_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - tms_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the `tms-documents` bucket (matches backend/.env.example
  # S3_BUCKET) so the app doesn't hit NoSuchBucket on first upload. Runs once
  # per `docker compose up`, then exits 0 — that's expected, not a failure.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tms_minio_admin tms_minio_dev_password &&
      mc mb --ignore-existing local/tms-documents
      "

volumes:
  tms_postgres_data:
  tms_minio_data:
